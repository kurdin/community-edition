services:
  mail:
    image: bytemark/smtp
    restart: always

  plausible_db:
    # Existing v2.0 installs created their volume with postgres:14. Keep
    # POSTGRES_VERSION=14 (in .env) or follow deployment.md section 3.5
    # (dump/restore) before using 16.
    image: postgres:${POSTGRES_VERSION:-16}-alpine
    restart: always
    volumes:
      - db-data:/var/lib/postgresql/data
    environment:
      - POSTGRES_PASSWORD=postgres
    healthcheck:
      # TCP check, so it isn't "ready" during first-time initdb (socket only)
      test: ["CMD-SHELL", "pg_isready -U postgres -h 127.0.0.1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 1m

  plausible_events_db:
    image: clickhouse/clickhouse-server:${CLICKHOUSE_VERSION:-24.12}-alpine
    restart: always
    volumes:
      - event-data:/var/lib/clickhouse
      - event-logs:/var/log/clickhouse-server
      - ./clickhouse/clickhouse-config.xml:/etc/clickhouse-server/config.d/logging.xml:ro
      - ./clickhouse/clickhouse-user-config.xml:/etc/clickhouse-server/users.d/logging.xml:ro
      - ./clickhouse/ipv4-only.xml:/etc/clickhouse-server/config.d/ipv4-only.xml:ro
      # Uncomment both lines on small servers (< 4GB RAM):
      # - ./clickhouse/low-resources.xml:/etc/clickhouse-server/config.d/low-resources.xml:ro
      # - ./clickhouse/default-profile-low-resources-overrides.xml:/etc/clickhouse-server/users.d/default-profile-low-resources-overrides.xml:ro
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    environment:
      - CLICKHOUSE_SKIP_USER_SETUP=1
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 -O - http://127.0.0.1:8123/ping || exit 1"]
      interval: 10s
      timeout: 5s
      # generous: after a version upgrade ClickHouse may need minutes to load parts
      retries: 60
      start_period: 1m

  plausible:
    # Built from the persistent-tracking fork instead of the pre-built image.
    # Set PLAUSIBLE_SRC in .env to a git URL with #branch/#tag, or to a local
    # checkout (e.g. PLAUSIBLE_SRC=../plausible-analytics-deviceId).
    # The default builds the fork's plausible-kurdin branch.
    build:
      context: ${PLAUSIBLE_SRC:-https://github.com/kurdin/plausible-analytics-deviceid.git#plausible-kurdin}
      args:
        MIX_ENV: ce
    image: plausible-deviceid:local
    restart: always
    command: sh -c "/entrypoint.sh db createdb && /entrypoint.sh db migrate && /entrypoint.sh run"
    depends_on:
      plausible_db:
        condition: service_healthy
      plausible_events_db:
        condition: service_healthy
      mail:
        condition: service_started
    ports:
      - 127.0.0.1:8000:8000
    env_file:
      - plausible-conf.env
    volumes:
      - plausible-data:/var/lib/plausible

volumes:
  db-data:
    driver: local
  event-data:
    driver: local
  event-logs:
    driver: local
  plausible-data:
    driver: local
